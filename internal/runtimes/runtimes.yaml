# Runtime catalog: the app types shown in the New App wizard.
# Data, not code — add a runtime or a version here, no Go changes needed.
#
# kinds:          which app kinds the runtime supports: web (port + domain) · worker · cron · task
# artifact.kind:  file    → the uploaded file is placed at artifact.path
#                 archive → zip / tar.gz extracted into the directory artifact.path
#                           (a single top-level folder such as dist/ is unwrapped automatically)
#                 none    → no artifact, the user provides an image (Docker image runtime)
# command / args: override the image entrypoint. Env vars are expanded by the shell where sh -c is used.
#                 Every app also gets PORT (the app port) and APP_ARGS (user arguments).
# run_as_user:    UID for all containers of the pod (init + app). Omit for images that need root.
# config_files:   files rendered with Go text/template (data: .Port, .Options) into a ConfigMap and mounted.
# Images are official multi-arch (amd64 + arm64) images.

runtimes:
  - id: java
    name: Java (JAR)
    description: Run an executable JAR on Eclipse Temurin.
    icon: java
    kinds: [web, worker, cron, task]
    artifact: { kind: file, accept: [".jar"], path: /app/app.jar }
    versions:
      - { id: "25", label: "Java 25 LTS", image: "eclipse-temurin:25-jre" }
      - { id: "21", label: "Java 21 LTS", image: "eclipse-temurin:21-jre", default: true }
      - { id: "17", label: "Java 17 LTS", image: "eclipse-temurin:17-jre" }
      - { id: "11", label: "Java 11 LTS", image: "eclipse-temurin:11-jre" }
      - { id: "8",  label: "Java 8 LTS",  image: "eclipse-temurin:8-jre" }
    command: ["sh", "-c", "exec java $JAVA_OPTS -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -jar /app/app.jar $APP_ARGS"]
    env: { JAVA_OPTS: "" }
    port: 8080
    health: { type: tcp }
    run_as_user: 65532

  - id: native
    name: Native binary
    description: A single executable (Go, Rust, C/C++, Zig…).
    icon: binary
    kinds: [web, worker, cron, task]
    artifact: { kind: file, accept: ["*"], path: /app/app, mode: "0755" }
    versions:
      - { id: debian, label: "Debian 13 slim (glibc)", image: "debian:trixie-slim", default: true }
      - { id: alpine, label: "Alpine (musl)", image: "alpine:3.22" }
      - { id: distroless, label: "Distroless (glibc, minimal)", image: "gcr.io/distroless/cc-debian12" }
      - { id: static, label: "Static binary (distroless static)", image: "gcr.io/distroless/static-debian12" }
    command: ["/app/app"]
    port: 8080
    health: { type: tcp }
    run_as_user: 65532

  - id: static
    name: Static website / SPA
    description: Serve a built frontend (zip of dist/ or build/).
    icon: web
    kinds: [web]
    artifact: { kind: archive, accept: [".zip", ".tar.gz", ".tgz"], path: /usr/share/nginx/html }
    versions:
      - { id: nginx, label: "nginx (unprivileged)", image: "nginxinc/nginx-unprivileged:1.29-alpine", default: true }
    options:
      spa_fallback: { type: bool, default: true, label: "Single-page app (serve index.html for unknown paths)" }
    port: 8080
    health: { type: http, path: / }
    run_as_user: 101
    config_files:
      - path: /etc/nginx/conf.d/default.conf
        template: |
          server {
            listen {{ .Port }};
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            gzip on;
            gzip_types text/css application/javascript application/json image/svg+xml;
            location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
              expires 7d;
              add_header Cache-Control "public";
              try_files $uri =404;
            }
            location / {
              {{- if .Options.spa_fallback }}
              try_files $uri $uri/ /index.html;
              {{- else }}
              try_files $uri $uri/ =404;
              {{- end }}
            }
          }

  - id: node
    name: Node.js
    description: A Node.js app (zip with package.json).
    icon: node
    kinds: [web, worker, cron, task]
    artifact: { kind: archive, accept: [".zip", ".tar.gz", ".tgz"], path: /app }
    versions:
      - { id: "24", label: "Node 24 LTS", image: "node:24-slim", default: true }
      - { id: "22", label: "Node 22 LTS", image: "node:22-slim" }
      - { id: "20", label: "Node 20", image: "node:20-slim" }
    command: ["sh", "-c", "cd /app && ([ -d node_modules ] || npm ci --omit=dev --no-audit --no-fund) && exec npm start -- $APP_ARGS"]
    env: { NODE_ENV: production, HOME: /tmp }
    port: 3000
    health: { type: tcp }
    run_as_user: 1000

  - id: python
    name: Python
    description: A Python app (zip with requirements.txt).
    icon: python
    kinds: [web, worker, cron, task]
    artifact: { kind: archive, accept: [".zip", ".tar.gz", ".tgz"], path: /app }
    versions:
      - { id: "3.13", label: "Python 3.13", image: "python:3.13-slim", default: true }
      - { id: "3.12", label: "Python 3.12", image: "python:3.12-slim" }
      - { id: "3.11", label: "Python 3.11", image: "python:3.11-slim" }
    command: ["sh", "-c", "cd /app && ([ ! -f requirements.txt ] || pip install --no-cache-dir -q -r requirements.txt --target /app/.deps) && PYTHONPATH=/app/.deps:/app exec $START_COMMAND $APP_ARGS"]
    env: { START_COMMAND: "python -m gunicorn --bind 0.0.0.0:8000 app:app", HOME: /tmp, PYTHONUNBUFFERED: "1" }
    port: 8000
    health: { type: tcp }
    run_as_user: 65532

  - id: php
    name: PHP
    description: A PHP site served by Apache.
    icon: php
    kinds: [web]
    artifact: { kind: archive, accept: [".zip", ".tar.gz", ".tgz"], path: /var/www/html }
    versions:
      - { id: "8.4", label: "PHP 8.4", image: "php:8.4-apache", default: true }
      - { id: "8.3", label: "PHP 8.3", image: "php:8.3-apache" }
    port: 80
    health: { type: http, path: / }
    # runs as root (Apache drops privileges to www-data itself)

  - id: image
    name: Docker image
    description: Any container image from a registry.
    icon: docker
    kinds: [web, worker, cron, task]
    artifact: { kind: none }
    port: 8080
    health: { type: tcp }
