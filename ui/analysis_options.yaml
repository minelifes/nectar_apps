analyzer:
  exclude:
    - build/**
    - web/**
    - android/**
    - ios/**
    - macos/**
    - lib/generated/** # Flutter Intl output (intl_utils): regenerated, never edited by hand
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - always_declare_return_types
    - avoid_print
