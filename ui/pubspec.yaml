name: nectar_apps_ui
description: Nectar Apps control panel — web, iOS, Android and macOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  file_picker: ^10.1.0
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.0
  xterm: ^4.0.0
  qr_flutter: ^4.1.0
  # native push (optional, configured in Settings → Push notifications; Android, iOS, macOS)
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.6.0
  intl_utils: ^2.8.10 # dart run intl_utils:generate (or the Flutter Intl IDE plugin)
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/LICENSE-Inter.txt
    - assets/fonts/LICENSE-SpaceGrotesk.txt
    - assets/fonts/LICENSE-JetBrainsMono.txt
  fonts:
    - family: Inter
      fonts:
        - { asset: assets/fonts/Inter-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/Inter-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/Inter-SemiBold.ttf, weight: 600 }
        - { asset: assets/fonts/Inter-Bold.ttf, weight: 700 }
    - family: SpaceGrotesk
      fonts:
        - { asset: assets/fonts/SpaceGrotesk-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/SpaceGrotesk-Bold.ttf, weight: 700 }
    - family: JetBrainsMono
      fonts:
        - { asset: assets/fonts/JetBrainsMono-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/JetBrainsMono-SemiBold.ttf, weight: 600 }

# dart run flutter_launcher_icons  (tool/bootstrap.sh runs it)
flutter_launcher_icons:
  image_path: assets/brand/icon-1024.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#0E0F12"
  adaptive_icon_foreground: assets/brand/icon-android-foreground.png
  macos:
    generate: true
    image_path: assets/brand/icon-rounded-1024.png
  web:
    generate: false

# Translations (Flutter Intl): lib/l10n/intl_en.arb is the main locale, intl_uk.arb Ukrainian. The Flutter Intl
# plugin (IntelliJ / VS Code) or `dart run intl_utils:generate` writes lib/generated/ — use S.of(context).key.
flutter_intl:
  enabled: true
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated
