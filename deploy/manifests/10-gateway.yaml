# nectar-gateway: the internet-facing reverse proxy (separate repo: minelifes/nectar_gateway).
# - hostNetwork: binds 80/443 directly on the node and sees real client IPs (rate limit / IP blocking).
# - Container ports are intentionally NOT declared, so a surge pod can start next to the old one
#   during updates (the gateway listens with SO_REUSEPORT) (zero-downtime updates).
# - The admin API (@@ADMIN_PORT@@, default 8081) is bound on the host network too: the host firewall
#   (configured by install.sh) must keep it closed to the internet. The panel reaches it through the
#   nectar-gateway-admin Service (port 8081), and every call needs the service token (G1).
# - Adopt mode (existing k3s) installs it on the shadow ports 18080/18443 first; `nectar-apps adopt
#   cutover` switches PROXY_ADDR/HTTPS_ADDR to :80/:443.
# - It runs on the node labelled nectar.dev/edge=true (the one DNS points to; install.sh labels it).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nectar-gateway-data
  namespace: @@NAMESPACE@@
  labels: { app.kubernetes.io/name: nectar-gateway, app.kubernetes.io/part-of: nectar }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nectar-gateway
  namespace: @@NAMESPACE@@
  labels: { app.kubernetes.io/name: nectar-gateway, app.kubernetes.io/part-of: nectar, app.kubernetes.io/managed-by: nectar-apps }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: nectar-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nectar-gateway, app.kubernetes.io/part-of: nectar }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet   # resolve *.svc.cluster.local upstreams
      nodeSelector: { nectar.dev/edge: "true" }
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 40     # gateway drains for up to 35s
      automountServiceAccountToken: false   # the gateway never talks to the k8s API
      containers:
        - name: gateway
          image: @@GATEWAY_IMAGE@@
          imagePullPolicy: IfNotPresent
          env:
            - { name: PROXY_ADDR, value: ":@@HTTP_PORT@@" }
            - { name: HTTPS_ADDR, value: ":@@HTTPS_PORT@@" }
            - { name: ADMIN_ADDR, value: ":@@ADMIN_PORT@@" }
            - { name: ADMIN_UI, value: "false" }          # headless: the panel is the UI (G8)
            - { name: DB_PATH, value: /data/nectar.db }
            # built-in Let's Encrypt; the account email can be changed later in the panel (onboarding / settings)
            - { name: ACME, value: "@@ACME@@" }
            - { name: ACME_EMAIL, value: "@@ACME_EMAIL@@" }
            - { name: GOMEMLIMIT, value: 1GiB }
            - name: GATEWAY_API_TOKEN                      # service token used by the panel (G1)
              valueFrom: { secretKeyRef: { name: nectar-secrets, key: gateway-api-token } }
          securityContext:
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: @@ADMIN_PORT@@ }    # G6
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: @@ADMIN_PORT@@ }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: nectar-gateway-data }
---
apiVersion: v1
kind: Service
metadata:
  name: nectar-gateway-admin
  namespace: @@NAMESPACE@@
  labels: { app.kubernetes.io/name: nectar-gateway, app.kubernetes.io/part-of: nectar }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: nectar-gateway }
  ports:
    - { name: admin, port: 8081, targetPort: @@ADMIN_PORT@@ }
---
# Ingress objects with this class are served by nectar-gateway (the panel syncs them to gateway routes).
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nectar
  labels: { app.kubernetes.io/name: nectar-gateway, app.kubernetes.io/part-of: nectar }
spec:
  controller: nectar.dev/gateway
