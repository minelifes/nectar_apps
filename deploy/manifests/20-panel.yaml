# nectar-apps: the control panel (API + embedded Flutter web UI).
# Until the first-run wizard publishes it through the gateway, the panel is reachable only via
# NodePort @@PANEL_NODEPORT@@, which the host firewall keeps closed — use an SSH tunnel.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nectar-apps
  namespace: @@NAMESPACE@@
  labels: { app.kubernetes.io/name: nectar-apps, app.kubernetes.io/part-of: nectar }
---
# What the panel may do cluster-wide. It creates and manages project namespaces (prj-*) and the
# objects inside them, reads cluster state for the Server page, and runs the updater Job.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nectar-apps
  labels: { app.kubernetes.io/name: nectar-apps, app.kubernetes.io/part-of: nectar }
rules:
  - apiGroups: [""]
    resources: [namespaces, resourcequotas, limitranges, serviceaccounts, secrets, configmaps, services, persistentvolumeclaims, pods, endpoints]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log, pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/stats, events, persistentvolumes]
    verbs: [get, list, watch]
  # Server page: cordon, drain (evictions) and remove nodes
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses, ingressclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status] # synced Ingresses show the edge address (kubectl, Argo CD health)
    verbs: [get, patch, update]
  # Ingress compatibility (adopt mode): Traefik and Gateway API routes are read and synced to the gateway
  - apiGroups: [traefik.io, traefik.containo.us]
    resources: [ingressroutes, middlewares, ingressroutetcps, ingressrouteudps]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways, gatewayclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  # k3s updates (Settings → Updates): plans of the system-upgrade-controller, when it is installed
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [upgrade.cattle.io]
    resources: [plans]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nectar-apps
  labels: { app.kubernetes.io/name: nectar-apps, app.kubernetes.io/part-of: nectar }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nectar-apps }
subjects:
  - { kind: ServiceAccount, name: nectar-apps, namespace: @@NAMESPACE@@ }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nectar-apps-data
  namespace: @@NAMESPACE@@
  labels: { app.kubernetes.io/name: nectar-apps, app.kubernetes.io/part-of: nectar }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }   # SQLite DB + uploaded artifacts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nectar-apps
  namespace: @@NAMESPACE@@
  labels: { app.kubernetes.io/name: nectar-apps, app.kubernetes.io/part-of: nectar, app.kubernetes.io/managed-by: nectar-apps }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single writer on an RWO volume
  selector:
    matchLabels: { app.kubernetes.io/name: nectar-apps }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nectar-apps, app.kubernetes.io/part-of: nectar }
    spec:
      serviceAccountName: nectar-apps
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: panel
          image: ghcr.io/minelifes/nectar-apps:@@NECTAR_VERSION@@
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: NECTAR_HTTP_ADDR, value: ":8080" }
            - { name: NECTAR_DATA_DIR, value: /data }
            - { name: NECTAR_BASE_DOMAIN, value: "@@BASE_DOMAIN@@" }
            - { name: NECTAR_GATEWAY_URL, value: "http://nectar-gateway-admin.@@NAMESPACE@@.svc:8081" }
            - { name: NECTAR_NAMESPACE, value: "@@NAMESPACE@@" }
            # app pods download artifacts from here (signed URLs)
            - { name: NECTAR_INTERNAL_URL, value: "http://nectar-apps.@@NAMESPACE@@.svc" }
            - { name: NECTAR_MAX_ARTIFACT_MB, value: "2048" }
            # domains: gateway (nectar-gateway) or ingress (keep an existing controller, adopt strategy "keep")
            - { name: NECTAR_ROUTING, value: "@@ROUTING@@" }
            - { name: NECTAR_INGRESS_CLASS, value: "@@INGRESS_CLASS@@" }
            # Ingress objects of these classes become gateway routes ("nectar" + the migrated controller's)
            - { name: NECTAR_INGRESS_SYNC, value: "@@INGRESS_SYNC@@" }
            - { name: NECTAR_INGRESS_CONTROLLER, value: "@@INGRESS_CONTROLLER@@" }
            - name: NECTAR_MASTER_KEY
              valueFrom: { secretKeyRef: { name: nectar-secrets, key: master-key } }
            - name: NECTAR_GATEWAY_TOKEN
              valueFrom: { secretKeyRef: { name: nectar-secrets, key: gateway-api-token } }
            - name: NECTAR_SETUP_TOKEN
              valueFrom: { secretKeyRef: { name: nectar-secrets, key: setup-token } }
            # built-in image registry for Git builds (install.sh --registry; absent = no registry)
            - name: NECTAR_REGISTRY_PASSWORD
              valueFrom: { secretKeyRef: { name: nectar-secrets, key: registry-password, optional: true } }
            - { name: NECTAR_REGISTRY_HOST, value: "@@REGISTRY_HOST@@" }
            - { name: NECTAR_REGISTRY_NODEPORT, value: "@@REGISTRY_NODEPORT@@" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: nectar-apps-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nectar-apps
  namespace: @@NAMESPACE@@
  labels: { app.kubernetes.io/name: nectar-apps, app.kubernetes.io/part-of: nectar }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: nectar-apps }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: @@PANEL_NODEPORT@@ }
