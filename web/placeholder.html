<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nectar Apps</title>
<style>
  :root { --bg:#0E0F12; --surface:#16181D; --border:#2A2E37; --text:#E8E9EC; --muted:#8A8F98; --amber:#F5A524; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  .card { width:min(440px,100%); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:32px; }
  .hex { width:44px; height:50px; background:var(--amber);
         clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); margin-bottom:20px; }
  h1 { font-size:22px; margin:0 0 8px; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0 0 12px; }
  code { font:13px "JetBrains Mono", ui-monospace, monospace; color:var(--amber); }
  #status { margin-top:20px; font-size:13px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; }
  .ok .dot { background:#3DD68C; }
</style>
</head>
<body>
<main class="card">
  <div class="hex" aria-hidden="true"></div>
  <h1>Nectar Apps</h1>
  <p>The panel API is running, but this binary was built without the web interface.</p>
  <p>Build it with <code>make ui</code> (needs Flutter), or use a release image, which always includes it.
     The API works either way: <code>GET /api/version</code>.</p>
  <div id="status"><span class="dot"></span>checking…</div>
</main>
<script>
  fetch('/api/version').then(r => r.json()).then(v => {
    const s = document.getElementById('status');
    s.className = 'ok';
    s.innerHTML = '<span class="dot"></span>v' + v.version + ' · API v' + v.api_version;
  }).catch(() => {});
</script>
</body>
</html>
