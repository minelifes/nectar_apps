# Releases: release-please keeps a release PR (changelog + version bump from conventional commits)
# open on main. Merging it tags vX.Y.Z and this workflow publishes the release:
#   multi-arch image → ghcr.io/minelifes/nectar-apps:X.Y.Z (+ :X.Y, :stable or :beta), pinned by digest
#   release.json attached to the GitHub release (read by the panel's updater)
#   updates.json on the gh-pages branch (the update feed, no GitHub API rate limits)
# Beta releases: push a tag like v1.3.0-beta.1 by hand.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*-*"]          # manual pre-release tags (beta/rc); stable tags come from release-please
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.3.0"
        required: true

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  COMPONENT: panel
  IMAGE: ghcr.io/${{ github.repository_owner }}/nectar-apps

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: always() && (needs.release-please.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ needs.release-please.outputs.tag || inputs.tag || github.ref_name }}"
          # accept vX.Y.Z and component-prefixed tags (nectar-gateway-vX.Y.Z)
          VERSION=$(printf '%s' "$TAG" | sed -E 's/^(.*-)?v([0-9]+\.[0-9]+\.[0-9]+)/\2/')
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "channel=beta" >> "$GITHUB_OUTPUT" ;; *) echo "channel=stable" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test -race -count=1 ./...

      # static binaries for the host-side commands (install.sh --adopt runs `nectar-apps adopt …` on the server)
      - name: Binaries (panel linux/amd64+arm64, CLI linux/darwin/windows)
        run: |
          V="${{ steps.tag.outputs.version }}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X nectar_apps/internal/version.Version=$V -X nectar_apps/internal/version.Commit=${GITHUB_SHA::7}" \
              -o dist/nectar-apps_linux_$arch ./cmd/nectar-apps
            (cd dist && sha256sum nectar-apps_linux_$arch > nectar-apps_linux_$arch.sha256)
          done
          # the nectar CLI (deploys from terminals and CI; the GitHub Action downloads it from the release)
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X nectar_apps/internal/version.Version=$V -X nectar_apps/internal/version.Commit=${GITHUB_SHA::7}" \
              -o dist/nectar_${os}_${arch}${ext} ./cmd/nectar
            (cd dist && sha256sum nectar_${os}_${arch}${ext} > nectar_${os}_${arch}${ext}.sha256)
          done
          ls -l dist

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          V="${{ steps.tag.outputs.version }}"
          TAGS="$IMAGE:$V,$IMAGE:${{ steps.tag.outputs.channel }}"
          if [ "${{ steps.tag.outputs.channel }}" = stable ]; then TAGS="$TAGS,$IMAGE:${V%.*}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-Nectar-Source-License-1.0

      - name: release.json
        run: |
          python3 scripts/release_meta.py release-json --component "$COMPONENT" \
            --version "${{ steps.tag.outputs.version }}" \
            --image "$IMAGE@${{ steps.build.outputs.digest }}" \
            --api-version-file internal/version/version.go \
            --migrations-glob 'internal/store/migrations/*' > release.json
          cat release.json

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            FLAGS=""; [ "${{ steps.tag.outputs.channel }}" = beta ] && FLAGS="--prerelease"
            gh release create "$TAG" $FLAGS --title "$TAG" --notes "$(python3 -c 'import json;print(json.load(open("release.json"))["notes"])')"
          fi
          gh release upload "$TAG" release.json --clobber
          # installer and host binaries for this exact version
          gh release upload "$TAG" deploy/install.sh dist/nectar-apps_linux_amd64 dist/nectar-apps_linux_amd64.sha256 \
            dist/nectar-apps_linux_arm64 dist/nectar-apps_linux_arm64.sha256 --clobber
          gh release upload "$TAG" dist/nectar_* --clobber

      - name: Update the feed (gh-pages/updates.json)
        run: |
          git config user.name "nectar-release-bot"
          git config user.email "support@techbrain.llc"
          cp release.json scripts/release_meta.py /tmp/
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show-ref --quiet refs/heads/gh-pages; then git checkout gh-pages; else git checkout --orphan gh-pages && git rm -rf . >/dev/null; fi
          python3 /tmp/release_meta.py update-feed --feed updates.json --release /tmp/release.json
          git add updates.json
          git commit -m "updates.json: $COMPONENT ${{ steps.tag.outputs.version }}"
          git push origin gh-pages
