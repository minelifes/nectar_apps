name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build (amd64 + arm64)
        run: |
          CGO_ENABLED=0 GOARCH=amd64 go build -o /dev/null ./cmd/nectar-apps
          CGO_ENABLED=0 GOARCH=arm64 go build -o /dev/null ./cmd/nectar-apps
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/nectar
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/nectar

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/fvm
          key: fvm-${{ runner.os }}-${{ hashFiles('ui/.fvmrc') }}
      - name: fvm + Flutter pinned in ui/.fvmrc
        run: echo "FVM=$(../scripts/ensure-fvm.sh)" >> "$GITHUB_ENV"
      - run: $FVM flutter pub get
      - name: translations (lib/l10n/*.arb → lib/generated)
        run: $FVM dart run intl_utils:generate
      - name: analyze
        run: $FVM flutter analyze
      - name: test
        run: $FVM flutter test
      - name: build web (embedded into the panel binary)
        run: $FVM flutter build web --release --no-web-resources-cdn

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -s sh deploy/install.sh scripts/*.sh
      - name: dry run
        run: sudo sh deploy/install.sh --dry-run -y --skip-firewall --manifests deploy/manifests --base-domain apps.example.com

  # A fresh install on the runner: k3s from get.k3s.io, the released nectar-gateway image, the panel image built
  # from this commit (preloaded through k3s' image directory), then scripts/e2e.sh drives the API.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: panel image
        run: docker build --build-arg VERSION=0.0.0-ci --build-arg COMMIT="$GITHUB_SHA" -t ghcr.io/minelifes/nectar-apps:0.0.0-ci .
      - name: preload it for k3s
        run: |
          sudo mkdir -p /var/lib/rancher/k3s/agent/images
          docker save ghcr.io/minelifes/nectar-apps:0.0.0-ci | sudo tee /var/lib/rancher/k3s/agent/images/nectar-apps.tar >/dev/null
      - name: CLI
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/nectar" ./cmd/nectar
      - name: install
        run: |
          sudo sh deploy/install.sh -y --skip-firewall --manifests deploy/manifests --version 0.0.0-ci \
            --base-domain apps.e2e.test --cli-binary "$RUNNER_TEMP/nectar"
      - name: smoke flows
        run: scripts/e2e.sh
      - name: CLI against the panel
        run: nectar version
      - name: diagnostics
        if: failure()
        run: |
          sudo k3s kubectl get all -A -o wide || true
          sudo k3s kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          sudo k3s kubectl -n nectar-system logs deploy/nectar-apps --tail=200 || true
          sudo k3s kubectl -n nectar-system logs deploy/nectar-gateway --tail=100 || true
